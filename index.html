<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birth Moment</title>
  <link rel="stylesheet" href="./src/css/styles.css">
  <script type="module" src="./src/js/app.js"></script>
</head>
<body>
  <!--
  <header class="site-banner" aria-label="Website invocation">
    <div class="banner-copy">
      <p>
        I first work for God by Devotion, then for Yogananda and the Gurus by Friendship, then for Myself by Love, then for Technology and the World by Passion.
      </p>
    </div>
    <img
      class="banner-image"
      src="./src/assets/images/paramahansa-yogananda-yogoda-satsanga-society-of-india-front.jpg"
      alt="Paramahansa Yogananda"
    >
  </header>
  -->

  <main>
    <section class="game-panel" aria-label="Game setup">
      <div class="panel-header">
        <span class="eyebrow">Game: Conquering the World</span>
        <div class="nav-row" aria-label="Step navigation">
          <button class="nav-button" type="button" data-flow-action="previous" aria-label="Previous step" hidden>&larr;</button>
          <button class="nav-button" type="button" data-flow-action="next" aria-label="Next step" hidden>&rarr;</button>
        </div>
      </div>

      <div class="step is-active" id="mode-step" aria-labelledby="mode-title">
        <h1 id="mode-title">Start a new game <span class="cursor" aria-hidden="true">_</span></h1>
        <p class="menu-action">Mode:</p>

        <div class="mode-grid" aria-label="Game modes">
          <button class="mode-button mode-button-adventure" type="button" data-mode="adventure" data-target="birth-step">
            <span class="mode-title">Adventure</span>
            <span class="mode-description">Explore your solo character's path (your date and place of birth). </span>
          </button>
          <button class="mode-button is-locked" type="button" data-mode="co-op" data-target="co-op-step" aria-disabled="true">
            <span class="lock-icon" aria-hidden="true">&#128274;</span>
            <span class="mode-title">Co-op</span>
            <span class="mode-description">Explore your relationship with other people (or with me to start).</span>
          </button>
          <button class="mode-button is-locked" type="button" data-mode="competition" data-target="competition-step" aria-disabled="true">
            <span class="lock-icon" aria-hidden="true">&#128274;</span>
            <span class="mode-title">Competition</span>
            <span class="mode-description">Start a quantum war in the present, activating superpowers.</span>
          </button>
        </div>
      </div>

      <div class="step" id="birth-step" aria-labelledby="birth-title" hidden>
        <h1 id="birth-title">Choosing your incarnation <span class="cursor" aria-hidden="true">_</span></h1>
        <p class="menu-action">Spawn:</p>

        <form id="birth-form">
          <label for="full-name">
            Full name *
            <input id="full-name" name="full-name" type="text" autocomplete="name" placeholder="Your full name" required>
          </label>

          <div class="form-grid">
            <label for="birth-date">
              Date of birth *
              <input id="birth-date" name="birth-date" type="date" required>
            </label>

            <label for="birth-time">
              Time of birth
              <input id="birth-time" name="birth-time" type="time">
            </label>
          </div>

          <div class="location-field">
            <label for="birth-place">
              Place of birth
              <input id="birth-place" name="birth-place" type="text" autocomplete="off" placeholder="Search city, country...">
            </label>
            <ul class="location-results" id="location-results" aria-label="Location suggestions" hidden></ul>
          </div>

          <button type="submit">Continue</button>
          <p id="form-message" class="form-message" aria-live="polite"></p>
        </form>
      </div>

      <div class="step" id="pillar-step" aria-labelledby="pillar-title" hidden>
        <h1 id="pillar-title">Character generated <span class="cursor" aria-hidden="true">_</span></h1>
        <p class="menu-action">Four pillars:</p>

        <div class="pillar-results" aria-label="BaZi four pillars result">
          <article class="result-pillar is-empty">
            <span class="pillar-label">Hour</span>
            <strong>--</strong>
            <span class="pillar-meta">Pending</span>
          </article>
          <article class="result-pillar is-empty">
            <span class="pillar-label">Day</span>
            <strong>--</strong>
            <span class="pillar-meta">Pending</span>
          </article>
          <article class="result-pillar is-empty">
            <span class="pillar-label">Month</span>
            <strong>--</strong>
            <span class="pillar-meta">Pending</span>
          </article>
          <article class="result-pillar" id="year-pillar">
            <span class="pillar-label">Year</span>
            <strong id="year-pillar-symbol">--</strong>
            <span class="pillar-meta" id="year-pillar-meta">Awaiting data</span>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
