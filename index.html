<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaycee.ai</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/src/assets/brand/jaycee-core-sigil.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/global.css">
  <link rel="stylesheet" href="./src/css/index.css">
  <link rel="stylesheet" href="/src/css/game-ui.css">
</head>
<body>
  <main class="game-title-screen" aria-label="Jaycee.ai title screen">
    <div class="game-grid" aria-hidden="true"></div>
    <div class="game-vignette" aria-hidden="true"></div>

    <section class="game-title-stage">
      <h1 class="game-brand-title"><a href="/">jaycee.ai</a></h1>
      <p class="auth-context" data-connection-context hidden>Create your game account first. Then return to approve the connection.</p>
      <button class="game-play-button" type="button" data-start-game aria-label="Play jaycee.ai">
        <span class="game-play-ring" aria-hidden="true"></span>
        <img src="./src/assets/brand/jaycee-core-sigil.svg" alt="">
        <span class="game-play-label">Play</span>
      </button>
    </section>
  </main>

  <script src="/src/js/referral.js"></script>
  <script src="./src/js/index.js"></script>
  <script type="module" src="/src/js/ui-sounds.js"></script>
  <script src="/src/js/auth/invite.js"></script>
  <script src="/src/js/config/app-config.js"></script>
  <script src="/src/js/auth/auth.js"></script>
  <script type="module" src="/src/js/jaycee/account.js"></script>
</body>
</html>
