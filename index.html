<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/global.css">
  <link rel="stylesheet" href="./src/profile/profile.css">
  <link rel="stylesheet" href="./src/css/techno-prayer.css">
  <link rel="stylesheet" href="./src/css/index.css">
</head>
<body data-theme="aurora">
  <jaycee-banner></jaycee-banner>

  <main class="home-frame-main">
    <section class="techno-prayer-page-card home-game-room" aria-label="Game room initialization">
      <div class="home-console is-booting" data-home-console aria-live="polite">
        <p class="home-command-line"><span>Jaycee.ai</span><span aria-hidden="true"> &gt; </span><span>game room initialization...</span></p>
        <p class="home-level-line" data-console-line="Unknown user..."><span aria-hidden="true">&gt;</span>Unknown user...</p>
        <p class="home-level-line" data-console-line="You are at level 1..."><span aria-hidden="true">&gt;</span>You are at level 1...<span class="cursor" aria-hidden="true">_</span></p>
      </div>
      <div class="home-start-panel">
        <button class="timeline-link home-start-button" type="button" data-start-game>Start a new game</button>
      </div>
      <div class="home-form-shell" data-home-form-shell hidden>
        <iframe class="home-techno-prayer-frame" data-techno-prayer-frame src="./techno-prayer.html" title="Techno-Prayer form"></iframe>
      </div>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="./src/js/shell/jaycee-shell.js"></script>
  <script src="./src/js/auth/auth.js"></script>
  <script src="./src/js/index.js"></script>
</body>
</html>
