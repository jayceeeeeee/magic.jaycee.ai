<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profiles | jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/jaycee-profile.css">
  <link rel="stylesheet" href="/src/css/profiles.css">
</head>
<body class="profiles-page" data-theme="aurora">
  <jaycee-banner></jaycee-banner>

  <main class="jaycee-settings-page profiles-list-page" data-profiles-list-shell hidden>
    <section class="profiles-list-panel" aria-labelledby="profiles-list-title">
      <div class="profiles-list-header">
        <h1 id="profiles-list-title">Jaycee.ai</h1>
        <div class="profiles-console" aria-label="Prayer information">
          <p class="profiles-console-prompt">Jaycee.ai&gt; sending your prayer...</p>
          <p>Oh! It looks like you were not the first to join here!</p>
          <p>Some players have played the game before you.</p>
          <p>Choose one of them to play with, they will be of a great help on your journey:</p>
        </div>
      </div>
      <div class="profile-resonance-status" data-profiles-list-status aria-live="polite">Loading profiles...</div>
      <div class="profiles-grid" data-profiles-list></div>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="/src/js/shell/shell.js"></script>
  <script src="/src/js/theme/themes.js"></script>
  <script src="/src/js/auth/auth.js"></script>
  <script type="module" src="/src/js/jaycee/profiles.js"></script>
</body>
</html>
