<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Magic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/shared/css/jaycee-shared.css">
</head>
<body data-theme="aurora">
  <jaycee-banner login-href="/auth.html" signup-href="/auth.html?mode=signup" account-href="/account.html"></jaycee-banner>

  <main class="auth-page">
    <section class="auth-panel" aria-labelledby="auth-title">
      <p class="auth-eyebrow">Account</p>
      <h1 id="auth-title">Log in</h1>

      <form class="auth-form" data-auth-form>
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" minlength="6" required>
        </label>
        <button class="account-button account-button-primary auth-submit" type="submit">Log in</button>
      </form>

      <p class="auth-status" data-auth-status aria-live="polite"></p>
      <p class="auth-switch" data-auth-switch></p>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="./src/shared/js/jaycee-shared.js"></script>
  <script src="./src/shared/js/jaycee-auth.js"></script>
  <script src="./src/shared/js/jaycee-auth-page.js"></script>
</body>
</html>
