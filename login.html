<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/game-ui.css">
</head>
<body class="auth-game-page">
  <jaycee-banner></jaycee-banner>

  <main class="auth-page signup-page-main">
    <section class="auth-panel" aria-labelledby="auth-title">
      <h1 class="game-brand-title" id="auth-title"><a href="/">jaycee.ai</a></h1>
      <p class="auth-eyebrow">Jaycee.ai&gt; Account login</p>

      <form class="auth-form" data-auth-form data-auth-mode="login">
        <label data-auth-signup-field hidden>
          <span>Full name</span>
          <input type="text" name="full_name" autocomplete="name">
        </label>
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" minlength="6" required>
        </label>
        <button class="account-button account-button-primary auth-submit" type="submit">Log in</button>
      </form>

      <p class="auth-status" data-auth-status aria-live="polite"></p>
      <p class="auth-switch" data-auth-switch hidden></p>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="/src/js/shell/shell.js"></script>
  <script src="/src/js/referral.js"></script>
  <script src="/src/js/auth/auth.js"></script>
  <script src="/src/js/auth/page.js"></script>
  <script type="module" src="/src/js/ui-sounds.js"></script>
  <script type="module" src="/src/js/jaycee/account.js"></script>
</body>
</html>
