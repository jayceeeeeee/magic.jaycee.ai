<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account - Jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
</head>
<body class="auth-game-page" data-theme="aurora">
  <jaycee-banner></jaycee-banner>

  <main class="auth-page signup-page-main">
    <section class="auth-panel" aria-labelledby="auth-title">
      <h1 class="game-brand-title" id="auth-title">jaycee.ai</h1>
      <p class="auth-eyebrow">Jaycee.ai&gt; Level 2: Create an account</p>

      <form class="auth-form" data-auth-form data-auth-mode="signup">
        <label data-auth-signup-field>
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="account-button account-button-primary auth-submit" type="submit">Sign up</button>
      </form>

      <p class="auth-status" data-auth-status aria-live="polite"></p>
      <p class="auth-switch" data-auth-switch>Already have an account? <a href="/login.html" data-auth-mode="login">Log in</a></p>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="/src/js/shell/shell.js"></script>
  <script src="/src/js/theme/themes.js"></script>
  <script src="/src/js/auth/auth.js"></script>
  <script src="/src/js/auth/page.js"></script>
</body>
</html>
