<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/jaycee-profile.css">
</head>
<body data-theme="aurora">
  <jaycee-banner></jaycee-banner>

  <main class="jaycee-settings-page is-account-page" data-account-shell hidden>
    <section class="jaycee-settings-panel" aria-labelledby="account-title">
      <div class="profile-settings-header">
        <p class="profile-kicker">jaycee.ai &gt; account</p>
        <h1 id="account-title">Account</h1>
      </div>

      <div class="profile-resonance-status" data-account-status aria-live="polite">Loading account...</div>
      <div class="jaycee-account-sections" data-account-sections></div>
      <div class="profile-settings-actions" data-account-actions hidden>
        <button type="button" data-account-save>Save</button>
        <p data-account-save-status></p>
      </div>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="/src/js/shell/shell.js"></script>
  <script src="/src/js/theme/themes.js"></script>
  <script src="/src/js/auth/auth.js"></script>
  <script type="module" src="/src/js/jaycee/account.js"></script>
</body>
</html>
