<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Magic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://shared.jaycee.ai/src/css/jaycee-shared.css">
</head>
<body data-theme="aurora">
  <jaycee-banner></jaycee-banner>

  <main class="auth-page">
    <section class="auth-panel" aria-labelledby="account-title">
      <p class="auth-eyebrow">Account</p>
      <h1 id="account-title">Your account</h1>

      <dl class="account-details">
        <div>
          <dt>Email</dt>
          <dd data-account-email>Loading...</dd>
        </div>
        <div>
          <dt>Status</dt>
          <dd data-account-status>Checking session...</dd>
        </div>
      </dl>

      <button class="account-button account-button-primary auth-submit" type="button" data-logout>Log out</button>
      <p class="auth-status" data-auth-status aria-live="polite"></p>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="https://shared.jaycee.ai/src/js/jaycee-shared.js"></script>
  <script src="https://shared.jaycee.ai/src/js/jaycee-auth.js"></script>
  <script src="https://shared.jaycee.ai/src/js/jaycee-account-page.js"></script>
</body>
</html>
