<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Room | jaycee.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/prayer.css">
</head>
<body class="prayer-page" data-theme="aurora">
    <main class="prayer-page-main">
        <h1 class="game-brand-title prayer-title">jaycee.ai</h1>
        <form class="prayer-form" aria-label="Prayer form">
            <div class="prayer-fields">
                <label>
                    <span>Problem</span>
                    <textarea name="problem" rows="1" placeholder="Describe the problem you want to solve today and what is its negative feeling." data-autogrow required></textarea>
                </label>

                <label>
                    <span>Prayer</span>
                    <textarea name="prayer" rows="1" placeholder="Write a prayer about this and what positive feeling you want out of this." data-autogrow required></textarea>
                </label>
            </div>

            <input name="learning" type="hidden" value="manifestation">
            <button class="prayer-submit" type="submit">Continue</button>
            <p class="prayer-status" data-prayer-status aria-live="polite"></p>
        </form>
    </main>

    <script src="/src/js/auth/auth.js"></script>
    <script src="/src/js/prayer.js"></script>
</body>
</html>
