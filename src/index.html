<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birth Moment</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <section class="birth-panel" aria-labelledby="birth-title">
      <h1 id="birth-title">Your birth moment</h1>
      <p>Enter the date and time you were born.</p>

      <form id="birth-form">
        <label for="birth-date">
          Date of birth
          <input id="birth-date" name="birth-date" type="date" required>
        </label>

        <label for="birth-time">
          Time of birth
          <input id="birth-time" name="birth-time" type="time" required>
        </label>

        <button type="submit">Continue</button>
        <p id="form-message" class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
