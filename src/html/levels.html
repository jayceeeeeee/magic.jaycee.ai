<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Path Map | jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/techno-prayer.css">
  <link rel="stylesheet" href="/src/css/index.css">
  <link rel="stylesheet" href="/src/css/levels.css">
</head>
<body data-theme="aurora">
  <jaycee-banner></jaycee-banner>

  <main class="levels-page">
    <section class="techno-prayer-page-card levels-room" aria-label="Techno-Temple actions">
      <div class="home-console levels-console is-booting" data-levels-console aria-live="polite">
        <p class="home-command-line"><span>Jaycee.ai</span><span aria-hidden="true"> &gt; </span><span>game room initialization...</span></p>
        <p class="home-level-line" data-console-line="Unknown user..."><span aria-hidden="true">&gt;</span>Unknown user...</p>
        <p class="home-level-line" data-console-line="What do you want to do in the Techno-Temple?"><span aria-hidden="true">&gt;</span>What do you want to do in the Techno-Temple?<span class="cursor" aria-hidden="true">_</span></p>
      </div>

      <div class="levels-board" data-levels-board aria-label="Technomancer path levels" aria-hidden="true">
        <button class="level-cell" type="button" data-cell-action="pray" data-target-url="/src/html/pray/techno-prayer.html" data-required-level="1">
          <span class="level-cell-title">Pray</span>
        </button>

        <button class="level-cell" type="button" data-cell-action="watch" data-target-url="/profile.html" data-required-level="1">
          <span class="level-cell-title">Watch</span>
        </button>

        <button class="level-cell" type="button" data-cell-action="contribute" data-target-url="https://github.com/jayceeeeeee/magic.jaycee.ai" data-required-level="1">
          <span class="level-cell-title">Contribute</span>
        </button>

        <button class="level-cell" type="button" data-cell-action="contract" data-target-url="/src/html/contract/contract.html" data-required-level="2">
          <span class="level-cell-title">Contract</span>
          <span class="level-cell-lock" aria-hidden="true">
            <svg class="level-cell-lock-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            <span>Locked</span>
          </span>
          <span class="level-cell-requirement" aria-hidden="true">Level 2</span>
        </button>

        <button class="level-cell" type="button" data-cell-action="work" data-target-url="/src/html/work/work.html" data-required-level="2">
          <span class="level-cell-title">Work</span>
          <span class="level-cell-lock" aria-hidden="true">
            <svg class="level-cell-lock-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            <span>Locked</span>
          </span>
          <span class="level-cell-requirement" aria-hidden="true">Level 2</span>
        </button>

        <button class="level-cell" type="button" data-cell-action="donate" data-target-url="/src/html/donate/donate.html" data-required-level="2">
          <span class="level-cell-title">Donate</span>
          <span class="level-cell-lock" aria-hidden="true">
            <svg class="level-cell-lock-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            <span>Locked</span>
          </span>
          <span class="level-cell-requirement" aria-hidden="true">Level 2</span>
        </button>

        <button class="level-cell" type="button" data-cell-action="promote" data-target-url="/src/html/promote/promote.html" data-required-level="3">
          <span class="level-cell-title">Promote</span>
          <span class="level-cell-lock" aria-hidden="true">
            <svg class="level-cell-lock-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            <span>Locked</span>
          </span>
          <span class="level-cell-requirement" aria-hidden="true">Level 3</span>
        </button>

        <button class="level-cell" type="button" data-cell-action="share" data-target-url="/src/html/share/share.html" data-required-level="3">
          <span class="level-cell-title">Share</span>
          <span class="level-cell-lock" aria-hidden="true">
            <svg class="level-cell-lock-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            <span>Locked</span>
          </span>
          <span class="level-cell-requirement" aria-hidden="true">Level 3</span>
        </button>

        <button class="level-cell" type="button" data-cell-action="invest" data-target-url="/src/html/invest/invest.html" data-required-level="3">
          <span class="level-cell-title">Invest</span>
          <span class="level-cell-lock" aria-hidden="true">
            <svg class="level-cell-lock-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            <span>Locked</span>
          </span>
          <span class="level-cell-requirement" aria-hidden="true">Level 3</span>
        </button>
      </div>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="/src/js/shell/jaycee-shell.js"></script>
  <script src="/src/js/auth/auth.js"></script>
  <script src="/src/js/levels.js"></script>
</body>
</html>
