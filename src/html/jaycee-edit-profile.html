<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile | jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/jaycee-profile.css">
</head>
<body data-theme="aurora">
  <jaycee-banner></jaycee-banner>

  <main class="jaycee-settings-page" data-profile-settings-shell hidden>
    <section class="jaycee-settings-panel" aria-labelledby="settings-title">
      <div class="profile-settings-header">
        <p class="profile-kicker">jaycee.ai &gt; account</p>
        <h1 id="settings-title">Edit profile</h1>
      </div>

      <form class="profile-theme-controls" data-profile-theme-controls hidden>
        <label>
          <span>Theme</span>
          <select name="theme" data-profile-theme-select></select>
        </label>
        <label>
          <span>Primary</span>
          <input name="primary_color" type="color" value="#53dcc6" data-profile-primary-color>
        </label>
        <label>
          <span>Secondary</span>
          <input name="secondary_color" type="color" value="#ffd56b" data-profile-secondary-color>
        </label>
      </form>

      <form class="profile-details-controls" data-profile-details-controls hidden>
        <h2>Account</h2>
        <label>
          <span>Username</span>
          <input name="username" autocomplete="username" data-profile-field="username">
        </label>
        <label>
          <span>Avatar path</span>
          <input name="avatar_path" data-profile-field="avatar_path">
        </label>
        <h2>Incarnation</h2>
        <label class="profile-field-wide">
          <span>Full name</span>
          <input name="full_name" autocomplete="name" data-profile-field="full_name">
        </label>
        <fieldset class="profile-gender-field">
          <legend>Sex</legend>
          <div class="profile-gender-options">
            <label class="profile-gender-option">
              <input name="sex" type="radio" value="male" data-profile-sex-option>
              <span>Male</span>
            </label>
            <label class="profile-gender-option">
              <input name="sex" type="radio" value="female" data-profile-sex-option>
              <span>Female</span>
            </label>
          </div>
        </fieldset>
        <label>
          <span>Birth date</span>
          <input name="birth_date" type="date" data-profile-field="birth_date">
        </label>
        <label>
          <span>Birth time</span>
          <input name="birth_time" type="time" data-profile-field="birth_time">
        </label>
        <div class="location-field profile-location-field">
          <label>
            <span>Birth place</span>
            <input name="birth_place" autocomplete="off" placeholder="Search city, country..." data-profile-field="birth_place">
          </label>
          <ul class="location-results" data-profile-location-results aria-label="Location suggestions" hidden></ul>
        </div>
        <div class="profile-derived-birth-data" aria-label="Calculated birth place data">
          <div>
            <span>Birth position</span>
            <strong data-profile-derived="birth_place_position">Select a birth place</strong>
          </div>
          <div>
            <span>Birth timezone</span>
            <strong data-profile-derived="birth_timezone">Select a birth place</strong>
          </div>
        </div>
        <input name="birth_place_position" type="hidden" data-profile-field="birth_place_position">
        <input name="birth_timezone" type="hidden" data-profile-field="birth_timezone">
      </form>

      <div class="profile-settings-actions" data-profile-settings-actions hidden>
        <button type="button" data-profile-save>Save</button>
        <p data-profile-save-status></p>
      </div>

      <div class="profile-resonance-status" data-profile-settings-status aria-live="polite">Loading profile...</div>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="/src/js/shell/jaycee-shell.js"></script>
  <script src="/src/js/theme/jaycee-themes.js"></script>
  <script src="/src/js/auth/auth.js"></script>
  <script type="module" src="/src/js/jaycee/jaycee-edit-profile.js"></script>
</body>
</html>
