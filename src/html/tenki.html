<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenki | jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/tenki.css">
</head>
<body data-theme="matrix">
  <jaycee-banner></jaycee-banner>

  <main class="tenki-page">
    <section class="tenki-console" aria-labelledby="tenki-title" data-tenki>
      <h1 class="tenki-title" id="tenki-title">Game: Tenki no Kagami (天機の鏡)</h1>

      <div class="tenki-stage" aria-label="Nine segment tenki frame">
        <div class="time-ring" aria-label="Outer time cycle" data-time-ring></div>

        <div class="space-grid" aria-label="Inner nine cell space matrix" data-space-grid></div>
      </div>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="/src/js/shell/jaycee-shell.js"></script>
  <script type="module" src="/src/js/tenki.js"></script>
</body>
</html>
