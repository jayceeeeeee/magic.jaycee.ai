<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenki | jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/tenki.css">
</head>
<body data-theme="lotus">
  <jaycee-banner></jaycee-banner>

  <main class="tenki-page">
    <section class="tenki-console" aria-label="Tenki no Kagami" data-tenki>
      <div class="tenki-command-console" aria-live="polite">
        <p class="tenki-command-line"><span>Jaycee.ai</span><span aria-hidden="true"> &gt; </span><span>Tenki no Kagami (&#22825;&#27231;&#12398;&#37857;)</span></p>
        <p class="tenki-status-line" data-tenki-console-line="Initialization..."><span aria-hidden="true">&gt;</span>Initialization...</p>
      </div>

      <div class="tenki-stage" aria-label="Tenki canvas frame">
        <canvas class="tenki-canvas" data-tenki-canvas aria-label="Tenki square and rings"></canvas>
      </div>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="/src/js/shell/jaycee-shell.js"></script>
  <script type="module" src="/src/js/tenki.js"></script>
</body>
</html>
