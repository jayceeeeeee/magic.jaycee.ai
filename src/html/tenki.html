<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenki | jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/tenki.css">
</head>
<body data-theme="aurora">
  <jaycee-banner></jaycee-banner>

  <main class="tenki-page">
    <section class="tenki-console" aria-labelledby="tenki-title">
      <h1 class="tenki-title" id="tenki-title">tenki</h1>

      <div class="tenki-stage" aria-label="Nine segment tenki frame">
        <div class="time-ring" aria-label="Outer time cycle">
          <div class="time-segment time-segment-1"><span>1</span></div>
          <div class="time-segment time-segment-2"><span>2</span></div>
          <div class="time-segment time-segment-3"><span>3</span></div>
          <div class="time-segment time-segment-4"><span>4</span></div>
          <div class="time-segment time-segment-5"><span>5</span></div>
          <div class="time-segment time-segment-6"><span>6</span></div>
          <div class="time-segment time-segment-7"><span>7</span></div>
          <div class="time-segment time-segment-8"><span>8</span></div>
          <div class="time-segment time-segment-9"><span>9</span></div>
        </div>

        <div class="space-grid" aria-label="Inner nine cell space matrix">
          <div class="space-cell">1</div>
          <div class="space-cell">2</div>
          <div class="space-cell">3</div>
          <div class="space-cell">4</div>
          <div class="space-cell">5</div>
          <div class="space-cell">6</div>
          <div class="space-cell">7</div>
          <div class="space-cell">8</div>
          <div class="space-cell">9</div>
        </div>
      </div>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="/src/js/shell/jaycee-shell.js"></script>
</body>
</html>
