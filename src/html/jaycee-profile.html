<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaycee Profile | jaycee.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/jaycee-profile.css">
</head>
<body data-theme="aurora">
  <jaycee-banner></jaycee-banner>

  <main class="jaycee-profile-page" data-profile-shell hidden>
    <section class="jaycee-profile-core" aria-label="Jaycee profile core">
      <form class="profile-theme-controls" data-profile-theme-controls hidden>
        <label>
          <span>Theme</span>
          <select name="theme" data-profile-theme-select></select>
        </label>
        <label>
          <span>Primary</span>
          <input name="primary_color" type="color" value="#53dcc6" data-profile-primary-color>
        </label>
        <label>
          <span>Secondary</span>
          <input name="secondary_color" type="color" value="#ffd56b" data-profile-secondary-color>
        </label>
        <p data-profile-theme-status></p>
      </form>
      <canvas class="jaycee-profile-canvas" data-profile-canvas aria-label="Jaycee profile core"></canvas>
    </section>

    <section class="jaycee-profile-resonances" aria-labelledby="profile-resonance-title">
      <div class="profile-resonance-header">
        <p class="profile-kicker" data-profile-kicker>jaycee.ai &gt; profile</p>
        <h1 id="profile-resonance-title">Dashboard</h1>
      </div>

      <div class="profile-resonance-status" data-profile-status aria-live="polite">Loading profile...</div>
      <div class="profile-resonance-list" data-profile-resonances></div>
    </section>
  </main>

  <jaycee-footer></jaycee-footer>

  <script src="/src/js/shell/jaycee-shell.js"></script>
  <script src="/src/js/theme/jaycee-themes.js"></script>
  <script src="/src/js/auth/auth.js"></script>
  <script type="module" src="/src/js/jaycee/jaycee-edit-profile.js"></script>
</body>
</html>
